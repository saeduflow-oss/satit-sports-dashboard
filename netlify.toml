# netlify.toml — ตั้งค่าการ deploy บน Netlify
# ปัญหาเดิม: Netlify เผยแพร่โฟลเดอร์รากของ repo ซึ่งไม่มี index.html หน้าแรกจึงขึ้น 404
# ไฟล์หน้าเว็บจริงอยู่ใน public/ และ API ต้องรันเป็น function เพราะ Netlify ไม่รัน Express ให้

[build]
  command = "npm run build"      # คอมไพล์ Tailwind + ก๊อป fonts/data เข้า public/
  publish = "public"             # รากของเว็บ = public/ (ไม่ใช่รากของ repo)
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"            # ต้อง 18 ขึ้นไป เพราะโค้ดใช้ fetch ที่ติดมากับ Node

[functions]
  node_bundler = "esbuild"
  # mock.json ถูกอ่านด้วย fs ตอนรัน ตัว bundler มองไม่เห็นเอง ต้องสั่งให้แพ็กไปด้วย
  included_files = ["data/mock.json"]

# ---- เส้นทาง API: ให้ path เดิมที่หน้าเว็บเรียกอยู่แล้ววิ่งเข้า function ----
[[redirects]]
  from = "/api/dashboard"
  to = "/.netlify/functions/dashboard"
  status = 200

# Netlify ไม่แทนค่า placeholder ลงใน query string ของ to (ลองแล้วได้ id ว่าง)
# จึงส่งต่อเป็น path แล้วให้ function อ่านส่วนท้ายของ path เอาเอง
[[redirects]]
  from = "/api/photo/*"
  to = "/.netlify/functions/photo/:splat"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
